[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcadeturtle"
version = "0.1.0"
description = "کتابخانه آموزشی لاک‌پشت با موتور Arcade — همان API ماژول turtle، با گرافیک مدرن و پشتیبانی فارسی"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "zack-riftwalker" },
]
keywords = ["turtle", "graphics", "education", "arcade", "persian", "farsi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Topic :: Education",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "arcade>=3.0,<4",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[project.urls]
Homepage = "https://github.com/zack-riftwalker/arcadeturtle"
Repository = "https://github.com/zack-riftwalker/arcadeturtle"
Issues = "https://github.com/zack-riftwalker/arcadeturtle/issues"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["arcadeturtle"]
