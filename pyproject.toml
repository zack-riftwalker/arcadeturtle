[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arcadeturtle"
version = "0.1.0"
description = "کتابخانه آموزشی لاک‌پشت با موتور Arcade — همان API ماژول turtle، با گرافیک مدرن و پشتیبانی فارسی"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "arcade>=3.0,<4",
    "arabic-reshaper>=3.0",
    "python-bidi>=0.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["arcadeturtle"]

[tool.hatch.build.targets.wheel.force-include]
"arcadeturtle/assets" = "arcadeturtle/assets"
